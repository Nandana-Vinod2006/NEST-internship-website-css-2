<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nest Digital - Home</title>

    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow-x: hidden; /* <-- changed so footer becomes visible */
            font-family: Arial, sans-serif;
        }

        .welcome-container {
            position: relative;
            height: 100vh;
            width: 100vw;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .welcome-title {
            position: absolute;
            top: 30px;
            font-size: 3rem;
            color: white;
            text-shadow: 0 3px 8px rgba(0,0,0,0.7);
            z-index: 2;
        }

        .nest-image {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            object-fit: cover;
            z-index: 1;
        }

        .nav-links {
            position: absolute;
            bottom: 40px;
            z-index: 2;
        }

        .nav-links a {
            margin: 0 15px;
            color: white;
            text-decoration: none;
            font-size: 1.3rem;
            font-weight: bold;
            text-shadow: 0 3px 5px rgba(0,0,0,0.7);
        }

        footer {
            margin-top: 20px;
        }
    </style>
</head>

<body>
<div class="welcome-container">
    <h1 class="welcome-title">WELCOME TO NEST DIGITAL</h1>
    <img src="https://nestdigital.com/wp-content/uploads/2023/07/Rectangle-162.png"
         class="nest-image"
         alt="Nest Digital Logo">
    <div class="nav-links">
        <a href="business.html">Our Services</a>
        <a href="about.html">About Us</a>
        <a href="contact.html">Contact</a>
    </div>
</div>


   <footer class="bg-dark text-white py-4">
  <div class="container text-center">
    <p>&copy; 2025 NeST DIGITAL. All rights reserved.</p>
  </div>
</footer>

</body>
</html>
